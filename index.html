            }
        ];

        // --- HELPER FUNCTION: SHUFFLE QUIZ COMPLETELY (DEEP SHUFFLE) ---
        const generateShuffledQuiz = (data) => {
            // 1. Shuffle the order of the questions
            let shuffledQ = [...data];
            for (let i = shuffledQ.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [shuffledQ[i], shuffledQ[j]] = [shuffledQ[j], shuffledQ[i]];
            }

            // 2. Shuffle the contents (options/matches) inside each question
            return shuffledQ.map(q => {
                if (q.type === 'single' || q.type === 'multi') {
                    // Create an array mapping each option with its correctness
                    let opts = q.options.map((opt, idx) => ({
                        opt,
                        opt_ar: q.options_ar[idx],
                        isCorrect: q.correct.includes(idx)
                    }));
                    // Shuffle the options array
                    for (let i = opts.length - 1; i > 0; i--) {
                        const j = Math.floor(Math.random() * (i + 1));
                        [opts[i], opts[j]] = [opts[j], opts[i]];
                    }
                    // Re-assemble the question with the new mixed options
                    return {
                        ...q,
                        options: opts.map(o => o.opt),
                        options_ar: opts.map(o => o.opt_ar),
                        correct: opts.map((o, idx) => o.isCorrect ? idx : -1).filter(idx => idx !== -1)
                    };
                } else if (q.type === 'matching') {
                    // Shuffle Left side
                    let leftOpts = q.leftItems.map((item, idx) => ({
                        item: { ...item },
                        item_ar: { ...q.leftItems_ar[idx] },
                        origIdx: idx
                    }));
                    for (let i = leftOpts.length - 1; i > 0; i--) {
                        const j = Math.floor(Math.random() * (i + 1));
                        [leftOpts[i], leftOpts[j]] = [leftOpts[j], leftOpts[i]];
                    }
                    // Reassign A, B, C letters so they stay in order vertically
                    leftOpts.forEach((lo, idx) => {
                        lo.item.letter = String.fromCharCode(65 + idx);
                        lo.item_ar.letter = String.fromCharCode(65 + idx);
                    });
                    
                    // Shuffle Right side
                    let rightOpts = q.rightItems.map((item, idx) => ({
                        item: { ...item },
                        origIdx: idx
                    }));
                    for (let i = rightOpts.length - 1; i > 0; i--) {
                        const j = Math.floor(Math.random() * (i + 1));
                        [rightOpts[i], rightOpts[j]] = [rightOpts[j], rightOpts[i]];
                    }

                    // Map the new correct connections
                    let newCorrectMatches = {};
                    leftOpts.forEach((lo, newLeftIdx) => {
                        const oldRightIdx = q.correctMatches[lo.origIdx];
                        const newRightIdx = rightOpts.findIndex(ro => ro.origIdx === oldRightIdx);
                        newCorrectMatches[newLeftIdx] = newRightIdx;
                    });

                    return {
                        ...q,
                        leftItems: leftOpts.map(lo => lo.item),
                        leftItems_ar: leftOpts.map(lo => lo.item_ar),
                        rightItems: rightOpts.map(ro => ro.item),
                        correctMatches: newCorrectMatches
                    };
                }
                return q;
            });
        };

        function App() {
            const [view, setView] = useState('start');
            // Init with deep shuffled quiz on the very first mount!
            const [shuffledQuiz, setShuffledQuiz] = useState(() => generateShuffledQuiz(quizData));
            const [currentIndex, setCurrentIndex] = useState(0);
            const [score, setScore] = useState(0);
            const [selectedIndices, setSelectedIndices] = useState([]);
            const [isSubmitted, setIsSubmitted] = useState(false);
            const [arabicTranslation, setArabicTranslation] = useState(false);
            const [wrongAnswers, setWrongAnswers] = useState([]);
            const [isDarkMode, setIsDarkMode] = useState(false);
            
            // Matching State
            const [matchingState, setMatchingState] = useState({});
            const [activeLeftItem, setActiveLeftItem] = useState(null);
            const [pinCoords, setPinCoords] = useState({});
            const containerRef = useRef(null);

            const currentQ = shuffledQuiz[currentIndex] || shuffledQuiz[0];

            useEffect(() => {
                if (isDarkMode) { document.body.classList.add('dark'); document.body.classList.remove('light'); }
                else { document.body.classList.add('light'); document.body.classList.remove('dark'); }
            }, [isDarkMode]);

            const calculatePinCoordinates = () => {
                if (!containerRef.current || currentQ.type !== 'matching') return;
                setTimeout(() => {
                    const parentRect = containerRef.current.getBoundingClientRect();
                    const newCoords = {};
                    currentQ.leftItems.forEach((_, idx) => {
                        const pinEl = document.getElementById(`left-pin-${idx}`);
                        if (pinEl) {
                            const rect = pinEl.getBoundingClientRect();
                            newCoords[`left-${idx}`] = { x: rect.left - parentRect.left + rect.width / 2, y: rect.top - parentRect.top + rect.height / 2 };
                        }
                    });
                    currentQ.rightItems.forEach((_, idx) => {
                        const pinEl = document.getElementById(`right-pin-${idx}`);
                        if (pinEl) {
                            const rect = pinEl.getBoundingClientRect();
                            newCoords[`right-${idx}`] = { x: rect.left - parentRect.left + rect.width / 2, y: rect.top - parentRect.top + rect.height / 2 };
                        }
                    });
                    setPinCoords(newCoords);
                }, 100);
            };

            useEffect(() => {
                calculatePinCoordinates();
                window.addEventListener('resize', calculatePinCoordinates);
                return () => window.removeEventListener('resize', calculatePinCoordinates);
            }, [currentIndex, view]);

            const toggleOption = (idx) => {
                if (isSubmitted) return;
                if (currentQ.type === 'single') {
                    setSelectedIndices([idx]);
                } else {
                    if (selectedIndices.includes(idx)) setSelectedIndices(prev => prev.filter(item => item !== idx));
                    else if (selectedIndices.length < currentQ.selectCount) setSelectedIndices(prev => [...prev, idx]);
                }
            };

            const selectLeftPin = (leftIdx) => { if (!isSubmitted) setActiveLeftItem(leftIdx); };

            const selectRightPin = (rightIdx) => {
                if (isSubmitted || activeLeftItem === null) return;
                setMatchingState(prev => {
                    const newState = { ...prev };
                    newState[activeLeftItem] = rightIdx;
                    return newState;
                });
                setActiveLeftItem(null);
                calculatePinCoordinates();
            };

            const handleSubmitAnswer = () => {
                if (isSubmitted) return;
                if (currentQ.type === 'matching') {
                    if (Object.keys(matchingState).length < currentQ.leftItems.length) return;
                    let isCorrect = true;
                    currentQ.leftItems.forEach((_, idx) => { if (matchingState[idx] !== currentQ.correctMatches[idx]) isCorrect = false; });
                    if (isCorrect) setScore(prev => prev + 1);
                    else setWrongAnswers(prev => [...prev, { question: currentQ, userSelection: { ...matchingState }, type: 'matching' }]);
                } else {
                    if (selectedIndices.length === 0) return;
                    const sortedSelected = [...selectedIndices].sort();
                    const sortedCorrect = [...currentQ.correct].sort();
                    const isCorrect = JSON.stringify(sortedSelected) === JSON.stringify(sortedCorrect);
                    if (isCorrect) setScore(prev => prev + 1);
                    else setWrongAnswers(prev => [...prev, { question: currentQ, userSelection: selectedIndices, type: currentQ.type }]);
                }
                setIsSubmitted(true);
            };

            const nextQuestion = () => {
                if (currentIndex < shuffledQuiz.length - 1) {
                    setCurrentIndex(prev => prev + 1);
                    setSelectedIndices([]); setMatchingState({}); setActiveLeftItem(null); setIsSubmitted(false);
                } else setView('result');
            };

            const startExam = () => {
                // Regenerate completely new random order for questions AND options!
                setShuffledQuiz(generateShuffledQuiz(quizData));
                setCurrentIndex(0); 
                setScore(0); 
                setSelectedIndices([]); 
                setMatchingState({}); 
                setActiveLeftItem(null); 
                setIsSubmitted(false); 
                setWrongAnswers([]); 
                setView('quiz');
            };

            const resetToHome = () => {
                setView('start');
            };

            const progress = ((currentIndex + 1) / shuffledQuiz.length) * 100;
            const pinColors = ['#3b82f6', '#10b981', '#f59e0b', '#ec4899', '#8b5cf6'];

            if (view === 'start') {
                return (
                    <div className="min-h-[85vh] flex items-center justify-center p-4 animate-fadeIn">
                        <div className="glass-card max-w-3xl w-full p-8 md:p-12 rounded-3xl text-center relative overflow-hidden transition-colors border">
                            <button onClick={() => setIsDarkMode(!isDarkMode)} className="absolute top-6 right-6 w-10 h-10 rounded-full bg-slate-500/10 flex items-center justify-center text-xl transition-all hover:scale-110">
                                <i className={`fas ${isDarkMode ? 'fa-sun text-amber-400' : 'fa-moon text-indigo-600'}`}></i>
                            </button>
                            <div className="w-24 h-24 bg-gradient-to-tr from-blue-600 to-indigo-600 text-white rounded-3xl flex items-center justify-center mx-auto mb-6 text-4xl shadow-lg shadow-blue-500/30">
                                <i className="fas fa-network-wired"></i>
                            </div>
                            <h1 className="text-3xl md:text-5xl font-extrabold mb-3 tracking-wide">CCNA Modules 11-13</h1>
                            <p className="font-semibold text-lg md:text-xl opacity-80 mb-4">IP Addressing Exam (Deep Randomization)</p>
                            <p className="text-sm opacity-60 mb-8 max-w-lg mx-auto leading-relaxed">
                                <i className="fas fa-shuffle mr-1 text-emerald-500"></i> Every time you enter or start this exam, the <b>questions, the options (A,B,C,D), and the matching targets</b> are deeply shuffled to prevent memorization!
                            </p>
                            <button onClick={startExam} className="w-full max-w-md bg-gradient-to-r from-blue-600 to-indigo-600 text-white font-bold py-4 rounded-2xl transition-all hover:scale-[1.02] shadow-xl text-lg">
                                Start Exam
                            </button>
                        </div>
                    </div>
                );
            }

            if (view === 'result') {
                const percentage = (score / shuffledQuiz.length) * 100;
                return (
                    <div className="min-h-screen py-6 animate-fadeIn">
                        <div className="glass-card max-w-4xl w-full mx-auto p-6 md:p-10 rounded-3xl">
                            <h2 className="text-3xl md:text-4xl font-extrabold text-center mb-2">Exam Result</h2>
                            <div className="flex justify-center items-center flex-col my-8">
                                <span className="text-5xl font-extrabold text-blue-500 mb-2">{Math.round(percentage)}%</span>
                                <span className="opacity-70">{score} / {shuffledQuiz.length} Correct Answers</span>
                            </div>
                            <div className="flex gap-4">
                                <button onClick={resetToHome} className="w-1/3 bg-slate-500 hover:bg-slate-600 text-white font-bold py-4 rounded-2xl transition-all">Home</button>
                                <button onClick={startExam} className="w-2/3 bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 rounded-2xl transition-all">Try Again <span className="text-xs opacity-80 ml-2">(Full Reshuffle)</span></button>
                            </div>
                        </div>
                    </div>
                );
            }

            return (
                <div className="w-full flex flex-col min-h-[90vh] py-4 animate-fadeIn">
                    <div className="flex justify-between items-center mb-4 px-2">
                        <button onClick={resetToHome} className="opacity-70 hover:opacity-100 font-semibold"><i className="fas fa-arrow-left"></i> Exit</button>
                        <div className="flex items-center gap-4">
                            <button onClick={() => setIsDarkMode(!isDarkMode)} className="text-lg"><i className={`fas ${isDarkMode ? 'fa-sun text-amber-400' : 'fa-moon text-indigo-600'}`}></i></button>
                            <div className="flex items-center gap-2">
                                <span className="text-xs font-semibold opacity-70">عربي</span>
                                <button onClick={() => setArabicTranslation(!arabicTranslation)} className={`relative inline-flex h-6 w-11 rounded-full transition-colors ${arabicTranslation ? 'bg-indigo-600' : 'bg-slate-400'}`}>
                                    <span className={`inline-block h-4 w-4 transform rounded-full bg-white transition-transform ${arabicTranslation ? 'translate-x-6' : 'translate-x-1'}`} />
                                </button>
                            </div>
                        </div>
                    </div>

                    <div className="w-full option-card h-2 rounded-full mb-6 border overflow-hidden"><div className="bg-gradient-to-r from-blue-500 to-indigo-500 h-full progress-bar" style={{ width: `${progress}%` }}></div></div>

                    <div className="glass-card p-6 md:p-8 rounded-3xl shadow-xl flex-grow flex flex-col justify-between">
                        <div>
                            <div className="flex justify-between items-center mb-4">
                                <div className="text-xs font-semibold text-blue-500 uppercase">Q {currentIndex + 1} of {shuffledQuiz.length}</div>
                                <div className="text-[10px] font-mono opacity-50 bg-slate-500/10 px-2 py-1 rounded">Orig ID: {currentQ.id}</div>
                            </div>
                            <h2 className="text-lg md:text-xl font-bold mb-6 leading-relaxed">{arabicTranslation ? currentQ.q_ar : currentQ.q}</h2>

                            {currentQ.type === 'matching' ? (
                                <div className="space-y-4 mb-8 relative" ref={containerRef}>
                                    <svg className="absolute inset-0 pointer-events-none w-full h-full z-10" style={{ minHeight: '250px' }}>
                                        {Object.keys(matchingState).map((leftKey) => {
                                            const leftIdx = parseInt(leftKey); const rightIdx = matchingState[leftIdx];
                                            const start = pinCoords[`left-${leftIdx}`]; const end = pinCoords[`right-${rightIdx}`];
                                            if (!start || !end) return null;
                                            const color = pinColors[leftIdx % pinColors.length];
                                            const isCorrect = isSubmitted && matchingState[leftIdx] === currentQ.correctMatches[leftIdx];
                                            const strokeColor = isSubmitted ? (isCorrect ? '#10b981' : '#ef4444') : color;
                                            return (
                                                <g key={leftKey}>
                                                    <path d={`M ${start.x} ${start.y} C ${(start.x + end.x)/2} ${start.y}, ${(start.x + end.x)/2} ${end.y}, ${end.x} ${end.y}`} fill="none" stroke={strokeColor} strokeWidth={isSubmitted ? "3" : "4"} className={!isSubmitted ? "connecting-line" : ""} opacity="0.85" />
                                                    <circle cx={start.x} cy={start.y} r="6" fill={strokeColor} />
                                                    <circle cx={end.x} cy={end.y} r="6" fill={strokeColor} />
                                                </g>
                                            );
                                        })}
                                    </svg>
                                    <div className="grid grid-cols-2 gap-8 md:gap-16 relative z-20">
                                        <div className="space-y-4">
                                            {(arabicTranslation ? currentQ.leftItems_ar : currentQ.leftItems).map((leftItem, idx) => {
                                                const isConnected = matchingState[idx] !== undefined;
                                                const isActive = activeLeftItem === idx;
                                                const color = pinColors[idx % pinColors.length];
                                                return (
                                                    <div key={idx} className={`flex items-center gap-3 p-3 rounded-xl border ${isActive ? 'border-blue-500 shadow-md' : 'option-card'}`}>
                                                        <div id={`left-pin-${idx}`} onClick={() => selectLeftPin(idx)} className={`w-8 h-8 rounded-full flex items-center justify-center font-bold text-sm cursor-pointer z-30 transition-transform ${!isConnected ? 'pin-unmatched border-2 hover:scale-110' : ''}`} style={isConnected ? { backgroundColor: color, color: '#fff' } : {}}>{leftItem.letter}</div>
                                                        <div className="text-xs md:text-sm font-medium opacity-90">{leftItem.text}</div>
                                                    </div>
                                                );
                                            })}
                                        </div>
                                        <div className="space-y-4">
                                            {currentQ.rightItems.map((rightItem, idx) => {
                                                const isConnected = Object.values(matchingState).includes(idx);
                                                let badgeText = '?';
                                                let badgeColor = '';
                                                if (isConnected) {
                                                    const mappedLeftIndices = Object.keys(matchingState).filter(k => matchingState[k] === idx);
                                                    badgeText = mappedLeftIndices.map(k => currentQ.leftItems[parseInt(k)].letter).join(',');
                                                    badgeColor = pinColors[parseInt(mappedLeftIndices[0]) % pinColors.length];
                                                }

                                                return (
                                                    <div key={idx} className="flex items-center gap-3 p-3 rounded-xl border option-card">
                                                        <div id={`right-pin-${idx}`} onClick={() => selectRightPin(idx)} className={`min-w-[2rem] px-2 h-8 rounded-full flex items-center justify-center font-bold text-sm cursor-pointer z-30 transition-transform ${!isConnected ? 'border-2 border-dashed hover:scale-110' : ''}`} style={isConnected ? { backgroundColor: badgeColor, color: '#fff' } : {}}>{badgeText}</div>
                                                        <div className="text-xs md:text-sm font-mono opacity-90">{rightItem.text}</div>
                                                    </div>
                                                );
                                            })}
                                        </div>
                                    </div>
                                </div>
                            ) : (
                                <div className="space-y-3 mb-8">
                                    {currentQ.options.map((opt, idx) => {
                                        const isSelected = selectedIndices.includes(idx);
                                        const isCorrectOpt = currentQ.correct.includes(idx);
                                        let cardClass = `w-full text-left p-4 rounded-2xl border-2 transition-all flex items-center gap-3 cursor-pointer ${isSubmitted ? 'disabled' : ''} `;
                                        
                                        if (!isSubmitted) cardClass += isSelected ? "border-blue-500 bg-blue-500/10 text-blue-600 dark:text-blue-300" : "option-card";
                                        else cardClass += isCorrectOpt ? "border-emerald-500 bg-emerald-500/10 text-emerald-600 dark:text-emerald-400" : (isSelected ? "border-red-500 bg-red-500/10 text-red-600 dark:text-red-400" : "option-card opacity-50");

                                        return (
                                            <div key={idx} onClick={() => toggleOption(idx)} className={cardClass}>
                                                <div className={`flex-shrink-0 w-5 h-5 rounded${currentQ.type==='single'?'-full':''} border-2 flex items-center justify-center transition-colors ${isSelected ? 'border-blue-500 bg-blue-500' : 'border-gray-400 dark:border-slate-500'}`}>
                                                    {isSelected && currentQ.type==='single' && <div className="w-2.5 h-2.5 rounded-full bg-white"></div>}
                                                    {isSelected && currentQ.type==='multi' && <i className="fas fa-check text-[10px] text-white"></i>}
                                                </div>
                                                <span className="text-sm md:text-base">{arabicTranslation ? currentQ.options_ar[idx] : opt}</span>
                                            </div>
                                        );
                                    })}
                                </div>
                            )}

                            {isSubmitted && (
                                <div className="p-4 rounded-2xl mb-8 terminal-box opacity-90 border animate-fadeIn">
                                    <h4 className="font-bold mb-2 text-amber-500 dark:text-amber-400"><i className="fas fa-lightbulb mr-2"></i> Explanation</h4>
                                    <p className="text-sm leading-relaxed">{arabicTranslation ? currentQ.explanation_ar : currentQ.explanation}</p>
                                </div>
                            )}
                        </div>

                        {!isSubmitted ? (
                            <button onClick={handleSubmitAnswer} disabled={currentQ.type === 'matching' ? Object.keys(matchingState).length < currentQ.leftItems.length : selectedIndices.length === 0} className={`w-full font-bold py-4 rounded-2xl shadow-lg text-white transition-colors ${((currentQ.type === 'matching' ? Object.keys(matchingState).length === currentQ.leftItems.length : selectedIndices.length > 0)) ? 'bg-blue-600 hover:bg-blue-700' : 'bg-gray-400 dark:bg-slate-700 disabled'}`}>Submit Answer</button>
                        ) : (
                            <button onClick={nextQuestion} className="w-full bg-slate-800 text-white dark:bg-slate-100 dark:text-slate-900 font-extrabold py-4 rounded-2xl shadow-lg transition-transform hover:scale-[1.01]">Next Question <i className="fas fa-arrow-right ml-2"></i></button>
                        )}
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
